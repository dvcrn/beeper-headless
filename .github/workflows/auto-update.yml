name: Auto-Update Upstream CLI

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      tag: ${{ steps.update.outputs.tag }}
      version: ${{ steps.update.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check upstream beeper/cli release
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          CURRENT_VERSION="$(tr -d '[:space:]' < VERSION)"
          LATEST_TAG="$(gh release view --repo beeper/cli --json tagName --jq '.tagName')"
          LATEST_VERSION="${LATEST_TAG#v}"

          echo "Current version: ${CURRENT_VERSION}"
          echo "Latest upstream: ${LATEST_VERSION} (${LATEST_TAG})"

          if [ -z "${LATEST_VERSION}" ] || [ "${LATEST_VERSION}" = "${CURRENT_VERSION}" ]; then
            echo "Already up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          gh release download "${LATEST_TAG}" \
            --repo beeper/cli \
            --pattern "binaries.json" \
            --dir "${TMP_DIR}"

          SHA256_AMD64="$(jq -r '.artifacts[] | select(.platform == "linux-x64") | .sha256' "${TMP_DIR}/binaries.json")"
          SHA256_ARM64="$(jq -r '.artifacts[] | select(.platform == "linux-arm64") | .sha256' "${TMP_DIR}/binaries.json")"

          if [[ ! "${SHA256_AMD64}" =~ ^[a-f0-9]{64}$ ]] || [[ ! "${SHA256_ARM64}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Invalid or missing Linux SHA-256 checksums in binaries.json" >&2
            exit 1
          fi

          for arch in x64 arm64; do
            url="https://github.com/beeper/cli/releases/download/${LATEST_TAG}/beeper-cli-${LATEST_VERSION}-linux-${arch}.tar.gz"
            curl -fsSLI "${url}" >/dev/null
          done

          printf '%s\n' "${LATEST_VERSION}" > VERSION
          sed -i \
            -e "s/^ARG BEEPER_CLI_VERSION=.*/ARG BEEPER_CLI_VERSION=${LATEST_VERSION}/" \
            -e "s/^ARG BEEPER_CLI_SHA256_AMD64=.*/ARG BEEPER_CLI_SHA256_AMD64=${SHA256_AMD64}/" \
            -e "s/^ARG BEEPER_CLI_SHA256_ARM64=.*/ARG BEEPER_CLI_SHA256_ARM64=${SHA256_ARM64}/" \
            Dockerfile

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION Dockerfile
          git commit -m "chore: update beeper-cli to ${LATEST_TAG}"
          git tag -a "${LATEST_TAG}" -m "beeper-cli ${LATEST_TAG}"
          git push origin HEAD:main "${LATEST_TAG}"

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${LATEST_VERSION}" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.updated == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
