name: Auto-Update Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      updated: ${{ steps.update.outputs.updated }}
      tag: ${{ steps.update.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check beeper/cli and Beeper Server for new releases
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_arg() { sed -n "s/^ARG $1=//p" Dockerfile; }
          CURRENT_CLI="$(current_arg BEEPER_CLI_VERSION)"
          CURRENT_SERVER="$(current_arg BEEPER_SERVER_VERSION)"

          # beeper/cli: version and per-arch sha256 from the release's binaries.json.
          CLI_TAG="$(gh release view --repo beeper/cli --json tagName --jq '.tagName')"
          CLI_VERSION="${CLI_TAG#v}"
          gh release download "${CLI_TAG}" --repo beeper/cli --pattern binaries.json --dir "${RUNNER_TEMP}" --clobber
          cli_sha() { jq -r --arg p "$1" '.artifacts[] | select(.platform == $p) | .sha256' "${RUNNER_TEMP}/binaries.json"; }
          CLI_SHA_AMD64="$(cli_sha linux-x64)"
          CLI_SHA_ARM64="$(cli_sha linux-arm64)"

          # Beeper Server: version and per-arch sha512 (base64 in the feed, hex for sha512sum).
          feed() { curl -fsSL "https://api.beeper.com/desktop/update-feed.json?bundleID=com.automattic.beeper.server&platform=linux&channel=stable&arch=$1"; }
          FEED_AMD64="$(feed x64)"
          FEED_ARM64="$(feed arm64)"
          SERVER_VERSION="$(jq -r .version <<<"${FEED_AMD64}")"
          if [ "$(jq -r .version <<<"${FEED_ARM64}")" != "${SERVER_VERSION}" ]; then
            echo "Server feed versions differ between arches; waiting for both to publish."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          hex_sha512() { jq -r .sha512 <<<"$1" | base64 -d | od -An -tx1 -v | tr -d ' \n'; }
          SERVER_SHA_AMD64="$(hex_sha512 "${FEED_AMD64}")"
          SERVER_SHA_ARM64="$(hex_sha512 "${FEED_ARM64}")"

          echo "CLI:    ${CURRENT_CLI} -> ${CLI_VERSION}"
          echo "Server: ${CURRENT_SERVER} -> ${SERVER_VERSION}"

          if [ "${CLI_VERSION}" = "${CURRENT_CLI}" ] && [ "${SERVER_VERSION}" = "${CURRENT_SERVER}" ]; then
            echo "Already up to date."
            echo "updated=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for sha in "${CLI_SHA_AMD64}" "${CLI_SHA_ARM64}"; do
            [[ "${sha}" =~ ^[a-f0-9]{64}$ ]] || { echo "Bad CLI sha256: ${sha}" >&2; exit 1; }
          done
          for sha in "${SERVER_SHA_AMD64}" "${SERVER_SHA_ARM64}"; do
            [[ "${sha}" =~ ^[a-f0-9]{128}$ ]] || { echo "Bad server sha512: ${sha}" >&2; exit 1; }
          done

          sed -i \
            -e "s/^ARG BEEPER_CLI_VERSION=.*/ARG BEEPER_CLI_VERSION=${CLI_VERSION}/" \
            -e "s/^ARG BEEPER_CLI_SHA256_AMD64=.*/ARG BEEPER_CLI_SHA256_AMD64=${CLI_SHA_AMD64}/" \
            -e "s/^ARG BEEPER_CLI_SHA256_ARM64=.*/ARG BEEPER_CLI_SHA256_ARM64=${CLI_SHA_ARM64}/" \
            -e "s/^ARG BEEPER_SERVER_VERSION=.*/ARG BEEPER_SERVER_VERSION=${SERVER_VERSION}/" \
            -e "s/^ARG BEEPER_SERVER_SHA512_AMD64=.*/ARG BEEPER_SERVER_SHA512_AMD64=${SERVER_SHA_AMD64}/" \
            -e "s/^ARG BEEPER_SERVER_SHA512_ARM64=.*/ARG BEEPER_SERVER_SHA512_ARM64=${SERVER_SHA_ARM64}/" \
            Dockerfile

          VERSION="${SERVER_VERSION}-cli${CLI_VERSION}"
          TAG="v${VERSION}"
          printf '%s\n' "${VERSION}" > VERSION

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION Dockerfile
          git commit -m "Update to Beeper Server ${SERVER_VERSION}, beeper-cli ${CLI_VERSION}"
          git tag -f "${TAG}"
          git push origin HEAD:main
          git push -f origin "${TAG}"

          echo "updated=true" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

  publish:
    needs: check
    if: needs.check.outputs.updated == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-publish.yml
    with:
      ref: ${{ needs.check.outputs.tag }}
