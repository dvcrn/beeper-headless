name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - entrypoint.sh
      - VERSION
      - .github/workflows/docker-publish.yml
  pull_request:
    paths:
      - Dockerfile
      - entrypoint.sh
      - VERSION
      - .github/workflows/docker-publish.yml
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Read versions
        id: version
        run: |
          echo "version=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "server=$(sed -n 's/^ARG BEEPER_SERVER_VERSION=//p' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: github.event_name != 'pull_request'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.version }},enable=${{ github.event_name != 'pull_request' }}
            type=raw,value=${{ steps.version.outputs.server }},enable=${{ github.event_name != 'pull_request' }}

      - name: Build and smoke-test native image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: beeper-headless:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test server under k8s-like securityContext
        run: |
          docker run --rm beeper-headless:test --version
          docker run -d --name smoke --user 65534:65534 --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --tmpfs /tmp \
            --tmpfs /data:rw,exec,uid=65534,gid=65534 -p 127.0.0.1:23373:23373 beeper-headless:test
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:23373/v1/info && exit 0
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Build and push multi-arch image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
